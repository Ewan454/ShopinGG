:root[data-theme="dark"]{--bg:#022543;--card:#0a3355;--tx:#eef2ec;--mu:#a9bccd;--bd:#1f4262;--bd2:#2a4d6c;--wa:#ff9f94;--ok:#8fd9a8;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#v{max-width:560px;margin:0 auto;padding:16px 20px 100px}
h1,h3{font-family:Fraunces,Georgia,serif}
h1{font-size:38px;font-weight:600;margin:8px 0 14px;letter-spacing:-.01em}
#v>h1:first-child,#v>.top+h1{position:relative;padding-right:76px;min-height:76px;display:flex;align-items:center}
#v>h1:first-child::after,#v>.top+h1::after{content:"";position:absolute;right:2px;top:50%;width:56px;height:70px;transform:translateY(-50%);background:var(--tx);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
h3{font-size:15px;color:var(--mu);margin:18px 0 6px;font-weight:600;letter-spacing:.02em}
.card{margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd2);border-radius:14px;padding:12px 14px;margin:0 0 8px;min-height:48px}
::placeholder{color:var(--mu);opacity:1}
select option{background:var(--bg);color:var(--tx)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:28px;height:28px;min-height:0;padding:0;margin:0;flex:none;border-radius:50%;border:2px solid var(--ac);background:transparent;display:grid;place-content:center;cursor:pointer}
input[type=checkbox]:checked{background:var(--ac)}
input[type=checkbox]:checked::after{content:"✓";color:var(--acx);font-size:15px;font-weight:700;line-height:1}
.row{display:flex;gap:8px;align-items:flex-start}.row>*{flex:1;min-width:0}
button{font:inherit;color:var(--tx);background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--tx);color:var(--bg);border-radius:99px;padding:12px 20px;min-height:48px;font-weight:600}
.sec{border:1px solid var(--tx);border-radius:99px;padding:10px 20px;min-height:44px;font-weight:600}
.sec.bad{border-color:var(--wa)}
.chips{display:flex;gap:18px;overflow-x:auto;padding:0 0 6px}
.chip{flex:none;border:0;border-bottom:2px solid transparent;background:none;padding:10px 0;min-height:44px;font-size:14px;color:var(--mu)}
.chip.on{color:var(--tx);font-weight:600;border-bottom-color:var(--ac)}
.chip[data-a=ring],.chip[data-a=sug]{color:var(--ac);font-weight:600}
.sw{flex:none;width:44px;height:44px;border-radius:50%;border:0}

${r.items.map((x,i)=>`<div class=it style="align-items:flex-start"><input type=checkbox data-a=rvon data-i=${i} ${x.on?'checked':''} aria-label="Include"><div class=g><input type=text data-a=rvn data-i=${i} value="${esc(x.n)}" style="margin-bottom:6px"><div class=row><input type=number min=0 step=any data-a=rva data-i=${i} value="${x.amt}" style="margin:0" aria-label="Amount"><select data-a=rvu data-i=${i} style="margin:0" aria-label="Unit">${UN.map(u=>`<option ${u===x.u?'selected':''}>${u}</option>`).join('')}</select><input type=number min=0 step=0.01 data-a=rvt data-i=${i} value="${x.tot}" style="margin:0" aria-label="Total paid in pounds"></div>${x.u!=='each'?`<input type=number min=1 step=any data-a=rvc data-i=${i} value="${x.cnt||''}" style="margin:6px 0 0" placeholder="Optional: how many items in the ${x.amt} ${x.u}?">`:''}<small id=rvx${i}>${rvTxt(x)}</small></div></div>`).join('')}
${U.msg?`<small class=bad>${esc(U.msg)}</small>`:''}
<div class=row style="margin-top:8px"><button class=sec data-a=rvcancel>Discard</button><button class=pri data-a=rvsave>Save prices</button></div></div>`}

function vShops(){
const s=U.shop,m=D.px[s]||{},ks=Object.keys(m).sort((a,b)=>m[a].n.localeCompare(m[b].n));
return `<h1>Shops</h1>${vScan()}<div class=chips>${SH.map(x=>`<button class="chip ${x===s?'on':''}" data-a=shop data-i="${x}">${x}</button>`).join('')}</div>
<div class=card><input id=sn list=names placeholder="Item, as named in recipes"><div class=row><input id=sp type=number min=0 step=0.01 placeholder="£" aria-label="Price"><select id=spu aria-label="Price per"><option value="">each</option><option value=g>per kg</option><option value=ml>per litre</option></select></div><button class=pri data-a=sadd style="width:100%;margin-top:8px">Save price at ${esc(s)}</button></div>
${ks.length?`<div class=card>${ks.map(k=>`<div class=it><div class=g><div>${esc(m[k].n)}</div><small>${plab(m[k].b)}${hist(m[k])}</small></div><input type=number step=0.01 min=0 value="${m[k].p}" data-a=pxe data-i="${k}" style="width:90px;margin:0" aria-label="Price"><button class=x data-a=sdel data-i="${k}" aria-label="Delete">✕</button></div>`).join('')}</div>`:`<p class=mu>No prices for ${esc(s)} yet.</p>`}`}

function vSet(){
return `<h1>Settings</h1><div class=card><b>Colour</b><div class=chips style="gap:12px;padding:12px 6px 8px">${Object.keys(AC).map(k=>`<button class="sw ${D.ac===k?'on':''}" data-a=ac data-i=${k} style="background:${AC[k][dark()?1:0]}" aria-label="${k}"></button>`).join('')}</div>
<div class=chips style="padding-bottom:0">${['auto','light','dark'].map(m=>`<button class="chip ${D.mode===m?'on':''}" data-a=mode data-i=${m}>${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div>
<div class=card style="border-top:1px solid var(--bd);padding-top:14px"><b>Text size</b><div class=chips>${['Small','Default','Large','Extra large'].map((l,i)=>`<button class="chip ${D.ts===i?'on':''}" data-a=ts data-i=${i}>${l}</button>`).join('')}</div></div>
${SM?'':`<div class=card style="border-top:1px solid var(--bd);padding-top:14px"><b>Receipt scanning</b><br><small>Uses your own Anthropic API key, kept only on this phone. Each scan uses a little of your API credit. Without a key you can still add prices by hand.</small><input id=ak type=password placeholder="sk-ant-…" value="${esc(D.key)}" style="margin-top:8px" autocomplete="off"><button class=pri data-a=key style="width:100%">Save key</button></div>`}
<div class=card style="border-top:1px solid var(--bd);padding-top:14px"><b>Backup</b><br><small>Your data lives on this phone. ${D.lastBackup?'Last saved '+new Date(D.lastBackup).toLocaleDateString('en-GB')+'.':'No backup saved yet.'}</small><div class=row style="margin-top:8px"><button class=sec data-a=exp>Save backup</button><label class=sec style="text-align:center;cursor:pointer">Restore<input id=imp type=file accept=".json,application/json" hidden></label></div></div>`}

const A={
isort:i=>U.sort=i,
iadd(){const n=v('in');if(!n)return;const o=toB(+v('iqt')||0,v('iu'));addInv(n,o.q,o.b,v('it'),v('il'));const x=D.inv.find(a=>K(a.name)===K(n)&&(a.b||'')!==o.b);if(x&&!D.pk[K(n)])toast('You also track '+n+' as '+(x.b||'items')+'. Tap ✎ to set a pack size so they combine.')},
'iq-':i=>{const x=D.inv.find(x=>x.id===i);x.qty=Math.max(0,N(x.qty-stepOf(x.b)))},
'iq+':i=>{const x=D.inv.find(x=>x.id===i);x.qty=N(x.qty+stepOf(x.b))},
idel:i=>D.inv=D.inv.filter(x=>x.id!==i),
lsort:i=>U.ls=i,
ladd(){const n=v('ln');if(!n)return;const o=toB(+v('lq')||1,v('lu'));addList(n,o.q,o.b)},
sug:i=>{const x=D.inv.find(x=>x.id===i);addList(x.name,x.b?500:1,x.b||'')},
tick:i=>{const x=D.list.find(x=>x.id===i);x.done=!x.done;U.pop=i},
'lq-':i=>{const x=D.list.find(x=>x.id===i);x.qty=Math.max(stepOf(x.b),N(x.qty-stepOf(x.b)))},
'lq+':i=>{const x=D.list.find(x=>x.id===i);x.qty=N(x.qty+stepOf(x.b))},
ldel:i=>D.list=D.list.filter(x=>x.id!==i),
fin(){D.list.filter(x=>x.done).forEach(x=>addInv(x.name,x.qty,x.b||''));D.list=D.list.filter(x=>!x.done)},
rf:i=>U.f=U.f===i?'':i,
rnew(){U.rid=null;U.draft=null;U.view='form'},
ropen(i){U.rid=i;U.view='detail';U.sv=null},
rback(){U.view=null},
redit(){U.view='form'},
rcancel(){U.draft=null;U.view=U.rid?'detail':null},
rdel(){D.rec=D.rec.filter(x=>x.id!==U.rid);D.plan=D.plan.filter(p=>p.rid!==U.rid);U.view=null},
rsave(){const n=v('rn');if(!n)return;
const ing=parseIng($('#ri').value);
const o={name:n,cuisine:v('rc'),tags:v('rt'),serves:+v('rs')||4,ing,steps:$('#rp').value.trim(),photo:U.ph},r=recOf(U.rid);
if(r)Object.assign(r,o);else{o.id=id();D.rec.push(o);U.rid=o.id}U.draft=null;U.view='detail';U.sv=null},
'sv-'(){const r=recOf(U.rid);U.sv=Math.max(1,(U.sv||r.serves)-1)},
'sv+'(){const r=recOf(U.rid);U.sv=(U.sv||r.serves)+1},
ring(i){const r=recOf(U.rid),g=r.ing[i],b=g.b||'';addList(g.name,Math.ceil(g.qty*sc(r)-1e-9)-have(g.name,b),b,1)},
padd(){const r=recOf(U.rid);D.plan.push({id:id(),rid:r.id,sv:U.sv||r.serves,date:v('pd')||null,done:false});syncPlan();U.tab='plan'},
made(i){const p=D.plan.find(x=>x.id===i),r=recOf(p.rid);r.ing.forEach(g=>take(g.name,g.b||'',g.qty*p.sv/r.serves));p.done=true;D.log.push({rid:r.id,ts:Date.now()})},
pdel:i=>D.plan=D.plan.filter(x=>x.id!==i),
shop:i=>U.shop=i,
sadd(){const n=v('sn'),p=parseFloat(v('sp')),b=v('spu');if(!n||isNaN(p))return;setPx(U.shop,n,b,p)},
sdel:i=>delete D.px[U.shop][i],
rvon(i){const x=U.rv.items[i];x.on=!x.on},
rvcancel(){U.rv=null;U.msg=''},
rvsave(){const r=U.rv,it=r.items.filter(x=>x.on&&x.n.trim());
if(it.some(x=>!isFinite(rvEach(x).p))){U.msg='Check the amounts, or untick items you don’t need.';return}
it.forEach(x=>{const o=rvEach(x);setPx(r.shop,x.n.trim(),o.b,N(o.p))});U.shop=r.shop;U.rv=null;U.msg=''},
iedit(i){U.ed=i;scrollTo(0,0)},
ecancel(){U.ed=null},
esave(){const x=D.inv.find(a=>a.id===U.ed);if(!x)return;x.name=v('en')||x.name;x.type=v('et');x.loc=v('el')||x.loc;x.stp=$('#es').checked;x.low=+v('elw')||0;
const q=+v('epq');if(q>0){const o=toB(q,v('epu'));D.pk[K(x.name)]={b:o.b,q:o.q}}else delete D.pk[K(x.name)];U.ed=null},
cook(){U.cook=!U.cook},
wl(){if(U.wl)U.wl.release();else if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{U.wl=l;l.addEventListener('release',()=>{U.wl=null;if(U.tab==='list')R()});R()}).catch(()=>{})},
share(){const t='Shopping list\n'+D.list.filter(x=>!x.done).map(x=>'• '+fmt(x.qty,x.b||'')+' '+x.name).join('\n');if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('List copied'))},
undo(){if(U.snap){D=JSON.parse(U.snap);U.snap=null}},
favf(){U.fav=!U.fav},
fresh(){U.fresh=!U.fresh},
surprise(){const f=D.rec.filter(fresh),r=f[Math.floor(Math.random()*f.length)];if(r){U.rid=r.id;U.view='detail';U.sv=null}},
rate(i){const r=recOf(U.rid);r.rate=r.rate===+i?0:+i},
fav(){const r=recOf(U.rid);r.fav=!r.fav},
cm(){U.view='cook';U.cs=0;wlOn()},
cend(){U.view='detail';if(U.wl)U.wl.release()},
cprev(){U.cs=Math.max(0,U.cs-1)},
cnext(){const r=recOf(U.rid),st=stepsOf(r);if(U.cs<st.length-1){U.cs++;return}const p=D.plan.find(x=>x.rid===r.id&&!x.done);if(p)A.made(p.id);else{r.ing.forEach(g=>take(g.name,g.b||'',g.qty*sc(r)));D.log.push({rid:r.id,ts:Date.now()})}A.cend();toast('Marked as made')},
tstart(i){clearInterval(ti);U.tm={end:Date.now()+(+i)*1000,label:'Step '+(U.cs+1)};ti=setInterval(tick,500);setTimeout(tick,0)},
tstop(){clearInterval(ti);U.tm=null},
qe(i){U.qe=i},
stap(i){const x=U.sel||STAPLES.slice();U.sel=x.includes(i)?x.filter(z=>z!==i):[...x,i]},
stadd(){(U.sel||STAPLES).forEach(n=>{addInv(n,1,'');const x=find(D.inv,n,'');if(x)x.stp=true});D.welcomed=true;U.sel=null},
stskip(){D.welcomed=true},
tcook(i){const p=D.plan.find(x=>x.id===i);U.rid=p.rid;U.sv=p.sv;U.tab='rec';U.view='cook';U.cs=0;wlOn()},
tpick(i){U.rid=i;U.sv=null;U.tab='rec';U.view='detail'},
merge(){const p=simPair();if(!p)return;const[,,a,b]=p,has=k=>D.inv.some(x=>K(x.name)===k),canon=has(b)&&!has(a)?b:a,other=canon===a?b:a;D.al[other]=canon;consolidate()},
nomerge(){const p=simPair();if(p)D.nd.push(p[2]+'|'+p[3])},
'wk-'(){U.wo--},'wk+'(){U.wo++},
cpw(){const m0=addD(mon(),U.wo*7),p0=iso(addD(m0,-7)),p1=iso(m0);D.plan.filter(p=>p.date&&p.date>=p0&&p.date<p1).forEach(p=>D.plan.push({id:id(),rid:p.rid,sv:p.sv,date:iso(addD(new Date(p.date+'T12:00'),7)),done:false}));syncPlan()},
ts(i){D.ts=+i},
paste(){U.paste=!U.paste},
pimp(){importText($('#pt').value);U.paste=false},
ac(i){D.ac=i;theme()},
mode(i){D.mode=i;theme()},
key(){D.key=v('ak')},
exp(){D.lastBackup=Date.now();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='shopingg-backup.json';a.click()}
};
const V={today:vToday,inv:vInv,list:vList,rec:vRec,plan:vPlan,shops:vShops,set:vSet};
function R(){save();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===U.tab));$('#v').innerHTML=(U.view?'':topbar())+V[U.tab]();$('#v').style.zoom=[.9,1,1.12,1.25][D.ts]||1;$('#names').innerHTML=[...new Set([...D.inv,...D.list].map(x=>x.name).concat(D.rec.flatMap(r=>r.ing.map(g=>g.name))))].map(n=>`<option value="${esc(n)}">`).join('');const q=$('#qe');if(q){q.focus();q.select()}U.pop=null}
document.addEventListener('click',e=>{
const t=e.target.closest('[data-t]');if(t){U.tab=t.dataset.t;if(U.view==='cook'&&U.wl)U.wl.release();U.view=null;U.msg='';U.ed=null;scrollTo(0,0);R();return}
const b=e.target.closest('[data-a]');if(!b||b.dataset.a==='pxe')return;
const a=b.dataset.a,f=A[a];if(f){if(DEST[a])U.snap=JSON.stringify(D);f(b.dataset.i);R();if(DEST[a])toast(DEST[a],1);else if(a==='undo')$('#toast').hidden=true}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a,i=t.dataset.i;
if(t.id==='qe'&&U.qe){const[k,id2]=U.qe.split(':'),x=(k==='iq'?D.inv:D.list).find(z=>z.id===id2),n=parseFloat(t.value);if(x&&!isNaN(n))x.qty=Math.max(0,N(n));U.qe=null;R();return}
if(t.id==='rcp'&&t.files[0]){scan(t.files[0]);return}
if(t.id==='rsc'&&t.files[0]){scanRecipe(t.files[0]);return}
if(a==='pday'){D.plan.find(x=>x.id===i).date=t.value||null;R();return}
if(t.id==='imp'&&t.files[0]){t.files[0].text().then(s=>{try{D=Object.assign(D0(),JSON.parse(s),{key:D.key});theme();R()}catch(x){}});return}
if(a==='pxe'){const p=parseFloat(t.value);if(!isNaN(p)){const e=D.px[U.shop][i];setPx(U.shop,e.n,e.b,p);save()}return}
if(U.rv&&a&&a.startsWith('rv')){const x=U.rv.items[i];
if(a==='rvshop')U.rv.shop=t.value;
if(!x)return;
if(a==='rvn')x.n=t.value;
if(a==='rvu'){x.u=t.value;R();return}
if(a==='rva')x.amt=parseFloat(t.value)||0;
if(a==='rvt')x.tot=parseFloat(t.value)||0;
if(a==='rvc')x.cnt=parseFloat(t.value)||0;
const e2=$('#rvx'+i);if(e2)e2.textContent=rvTxt(x);return}
if(t.id==='ph'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,480/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);U.ph=c.toDataURL('image/jpeg',.7);const pv=$('#pv');pv.style.backgroundImage=`url(${U.ph})`;pv.textContent=''};im.src=fr.result};fr.readAsDataURL(t.files[0])}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q!==undefined){const q=t.value.toLowerCase();document.querySelectorAll('#v [data-n]').forEach(el=>el.hidden=!el.dataset.n.includes(q))}});
document.addEventListener('focusout',e=>{if(e.target.id==='qe'&&U.qe){U.qe=null;setTimeout(R,0)}});
let sw=null;
document.addEventListener('touchstart',e=>{const r=e.target.closest('[data-sw]');if(!r||e.target.closest('button,input,select'))return;sw={r,x:e.touches[0].clientX,y:e.touches[0].clientY,d:0}},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dx)<12){sw=null;return}sw.d=dx;sw.r.style.transform='translateX('+dx+'px)';sw.r.style.opacity=1-Math.min(.5,Math.abs(dx)/300)},{passive:true});
document.addEventListener('touchend',()=>{if(!sw)return;const{r,d}=sw;sw=null;r.style.transform='';r.style.opacity='';if(Math.abs(d)>90){const[k,i]=r.dataset.sw.split(':');if(d>0&&k==='l'){A.tick(i);R()}else if(d<0){const a=k==='l'?'ldel':'idel';U.snap=JSON.stringify(D);A[a](i);R();toast(DEST[a],1)}}});
{const h=location.hash.slice(1);if(V[h])U.tab=h}
theme();R();
(async()=>{try{if(window.claude){SM=await claude.use('sample');if(SM){const l=await SM.limits();IMG=!!(l&&l.images)}}}catch(e){}if(!U.rv&&!U.rs&&(U.tab==='shops'||U.tab==='set'))R()})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>

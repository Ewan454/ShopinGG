<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>ShopinGG</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3f2;--card:#fff;--tx:#14201e;--mu:#667773;--ac:#0b8f7f;--acx:#fff;--bd:#dce6e3;--wa:#c8453f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1716;--card:#18221f;--tx:#eaf3f1;--mu:#8fa39e;--bd:#26332f;--wa:#ff7a72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1716;--card:#18221f;--tx:#eaf3f1;--mu:#8fa39e;--bd:#26332f;--wa:#ff7a72;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#v{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:30px;margin:8px 0 14px;letter-spacing:-.02em}
h3{font-size:14px;color:var(--mu);margin:18px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:0 0 8px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:24px;height:24px;margin:0;accent-color:var(--ac)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button{font:inherit;color:var(--tx);background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.pri{background:var(--ac);color:var(--acx);border-radius:12px;padding:10px 16px;font-weight:600}
.sec{border:1px solid var(--bd);border-radius:12px;padding:10px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;border:1px solid var(--bd);border-radius:99px;padding:6px 14px;background:var(--card);font-size:14px}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.sw{flex:none;width:42px;height:42px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd)}
.sw.on{box-shadow:0 0 0 3px var(--tx)}
.it{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.it>.g{flex:1;min-width:0}
small,.mu{color:var(--mu)}small{font-size:13px}
.bad{color:var(--wa)}.ok{color:var(--ac)}
.z .g>div:first-child{opacity:.5}.dn .g{text-decoration:line-through;opacity:.5}
.st{display:flex;align-items:center;gap:6px}
.st button{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);font-size:18px;line-height:1}
.st b{min-width:56px;text-align:center;font-size:15px}
.x{color:var(--mu);padding:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--mu);gap:2px}
nav button span{font-size:21px}nav .on{color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;width:100%}
.im{aspect-ratio:4/3;background:var(--bd) center/cover;display:flex;align-items:center;justify-content:center;font-size:36px}
.rc .t{padding:10px}.hero{border-radius:18px;margin-bottom:12px}
.tr{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.best{color:var(--ac);font-weight:700}
</style></head><body>
<div id="v"></div>
<nav>
<button data-t="inv"><span>📦</span>Inventory</button>
<button data-t="list"><span>🛒</span>List</button>
<button data-t="rec"><span>📖</span>Recipes</button>
<button data-t="plan"><span>🗓️</span>Plan</button>
<button data-t="shops"><span>🏪</span>Shops</button>
<button data-t="set"><span>⚙️</span>Settings</button>
</nav>
<script>
const SH=['Lidl','Asda','Sainsbury’s','Morrisons','Tesco','Local'],UN=['each','g','kg','ml','l'];
const AC={Teal:['#0b8f7f','#35c4b0'],Blue:['#2563eb','#6ea0ff'],Violet:['#7c3aed','#a98bff'],Rose:['#e11d6a','#ff6fa5'],Orange:['#d9480f','#ff9a55'],Green:['#2f9e44','#5fd37a']};
const D0=()=>({inv:[],list:[],rec:[],plan:[],px:{},ac:'Teal',mode:'auto',key:''});
let D=D0(),U={tab:'inv',sort:'type',ls:'plain',shop:SH[0],rid:null,view:null,sv:null,f:'',ph:'',rv:null,rs:'',msg:''},SM=null,IMG=false;
try{const r=localStorage.getItem('shopingg');if(r)D=Object.assign(D,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('shopingg',JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s),v=i=>$('#'+i).value.trim();
const K=s=>s.toLowerCase().trim().replace(/\s+/g,' ').replace(/(es|s)$/,'');
const id=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=x=>Math.round(x*100)/100,gbp=x=>'£'+x.toFixed(2);
function theme(){const r=document.documentElement,m=D.mode,dk=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches),c=AC[D.ac]||AC.Teal;
if(m==='auto')r.removeAttribute('data-theme');else r.dataset.theme=m;
r.style.setProperty('--ac',c[dk?1:0]);r.style.setProperty('--acx',dk?'#06100f':'#fff');
const t=$('meta[name=theme-color]');if(t)t.content=getComputedStyle(r).getPropertyValue('--bg').trim()||c[0]}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
// units: quantities are stored in g, ml or a plain count
const toB=(q,u)=>({q:u==='kg'||u==='l'?q*1000:q,b:u==='kg'||u==='g'?'g':u==='l'||u==='ml'?'ml':''});
const fmt=(q,b)=>b?(q>=1000?N(q/1000)+(b==='g'?' kg':' l'):N(q)+' '+b):N(q);
const stepOf=b=>b?100:1,lab=b=>({g:'/kg',ml:'/l'}[b||'']||''),plab=b=>({g:'per kg',ml:'per litre'}[b||'']||'each');
const usel=i=>`<select id=${i} aria-label="Unit">${UN.map(u=>`<option>${u}</option>`).join('')}</select>`;
const T=[['Cleaning','bleach|detergent|washing|sponge|soap|cleaner|bin bag|toilet|dishwasher'],['Fish','salmon|cod|prawn|haddock|fish'],['Meat','chicken|beef|mince|pork|lamb|bacon|sausage|ham|turkey|steak'],['Dairy & Eggs','milk|cheese|butter|yogh?urt|cream|egg'],['Fruit','apple|banana|orange|lemon|lime|berr|grape'],['Veg','tomato|onion|carrot|potato|pepper|garlic|broccoli|lettuce|cucumber|mushroom|spinach|courgette|cabbage|leek'],['Tins & Dry','tin|bean|chickpea|lentil|rice|pasta|flour|sugar|oil|sauce|stock|noodle|tuna|spice|salt']];
const typ=n=>{n=n.toLowerCase();for(const[t,r]of T)if(new RegExp(r).test(n))return t;return'Other'};
const locDef=t=>({Cleaning:'Cleaning','Tins & Dry':'Cupboard',Other:'Cupboard',Fruit:'Cupboard'}[t]||'Fridge');
const find=(a,n,b)=>a.find(x=>K(x.name)===K(n)&&(x.b||'')===(b||'')),have=(n,b)=>(find(D.inv,n,b)||{qty:0}).qty;
function addInv(n,q,b,t,l){const i=find(D.inv,n,b);if(i)i.qty=N(i.qty+q);else{t=t||typ(n);D.inv.push({id:id(),name:n,qty:q,b,type:t,loc:l||locDef(t)})}}
function addList(n,q,b,mx){const i=D.list.find(x=>K(x.name)===K(n)&&(x.b||'')===(b||'')&&!x.done);if(i)i.qty=mx?Math.max(i.qty,q):N(i.qty+q);else D.list.push({id:id(),name:n,qty:q,b:b||'',done:false})}
const pk=(n,b)=>K(n)+'|'+(b||''),ext=(p,q,b)=>p*(b?q/1000:q);
const pr=(n,b,s)=>{const e=(D.px[s]||{})[pk(n,b)];return e?e.p:null};
const best=(n,b)=>{let o=null;SH.forEach(s=>{const p=pr(n,b,s);if(p!=null&&(!o||p<o.p))o={s,p}});return o};
const tl=r=>[r.cuisine,...(r.tags||'').split(',').map(s=>s.trim())].filter(Boolean);
const recOf=i=>D.rec.find(x=>x.id===i),sc=r=>(U.sv||r.serves)/r.serves;
function syncPlan(){const m={};D.plan.filter(p=>!p.done).forEach(p=>{const r=recOf(p.rid);if(!r)return;r.ing.forEach(g=>{const k=pk(g.name,g.b);m[k]=m[k]||{n:g.name,b:g.b||'',q:0};m[k].q+=g.qty*p.sv/r.serves})});Object.values(m).forEach(g=>{const s=Math.ceil(g.q-1e-9)-have(g.n,g.b);if(s>0)addList(g.n,s,g.b,1)})}
const stp=(a,i,t)=>`<span class=st><button data-a="${a}-" data-i="${i}" aria-label="Less">−</button><b>${t}</b><button data-a="${a}+" data-i="${i}" aria-label="More">+</button></span>`;

function vInv(){
const g={};D.inv.forEach(i=>{const k=U.sort==='az'?'All items':i[U.sort]||'Other';(g[k]=g[k]||[]).push(i)});
const locs=[...new Set(D.inv.map(i=>i.loc))];
return `<h1>Inventory</h1><div class=card><input id=in placeholder="Add item, e.g. chicken breast"><div class=row><input id=iqt type=number min=0 step=any value=1 aria-label="Amount">${usel('iu')}<input id=il list=ll placeholder="Location"></div><datalist id=ll>${locs.map(l=>`<option>${esc(l)}</option>`).join('')}</datalist><div class=row style="margin-top:8px"><select id=it style="margin:0"><option value="">Type: auto</option>${T.map(t=>`<option>${t[0]}</option>`).join('')}<option>Other</option></select><button class=pri data-a=iadd>Add</button></div></div>
<div class=chips>${[['type','By type'],['loc','By location'],['az','A–Z']].map(([k,l])=>`<button class="chip ${U.sort===k?'on':''}" data-a=isort data-i=${k}>${l}</button>`).join('')}</div>
${D.inv.length?'':'<p class=mu>Nothing here yet. Add what’s in your cupboards, or finish a shop and it fills itself.</p>'}
${Object.keys(g).sort().map(k=>`<h3>${esc(k)}</h3><div class=card>${g[k].sort((a,b)=>a.name.localeCompare(b.name)).map(i=>`<div class="it ${i.qty<=0?'z':''}"><div class=g><div>${esc(i.name)}</div><small>${esc(U.sort==='type'?i.loc:U.sort==='loc'?i.type:i.loc+' · '+i.type)}${i.qty<=0?' · out':''}</small></div>${stp('iq',i.id,fmt(i.qty,i.b||''))}<button class=x data-a=idel data-i=${i.id} aria-label="Delete">✕</button></div>`).join('')}</div>`).join('')}`}

function vList(){
const L=D.list,sug=D.inv.filter(i=>i.qty<=0&&!L.some(x=>K(x.name)===K(i.name)&&(x.b||'')===(i.b||'')&&!x.done));
const tot=SH.map(s=>{let t=0,m=0;L.forEach(x=>{const p=pr(x.name,x.b,s);p==null?m++:t+=ext(p,x.qty,x.b)});return{s,t,m}}).filter(o=>o.m<L.length);
let bs=null;if(tot.length){const mm=Math.min(...tot.map(o=>o.m)),c=tot.filter(o=>o.m===mm),mt=Math.min(...c.map(o=>o.t));bs=c.find(o=>o.t===mt).s}
const g={};L.forEach(x=>{const b=best(x.name,x.b),k=U.ls==='shop'?(b?b.s:'No price yet'):'To buy';(g[k]=g[k]||[]).push(x)});
const nd=L.filter(x=>x.done).length;
return `<h1>Shopping list</h1><div class=card><input id=ln placeholder="Add item"><div class=row><input id=lq type=number min=0 step=any value=1 aria-label="Amount">${usel('lu')}<button class=pri data-a=ladd>Add</button></div></div>
${sug.length?`<h3>Out of stock. Add again?</h3><div class=chips>${sug.map(i=>`<button class=chip data-a=sug data-i=${i.id}>+ ${esc(i.name)}</button>`).join('')}</div>`:''}
<div class=chips>${[['plain','As added'],['shop','By cheapest shop']].map(([k,l])=>`<button class="chip ${U.ls===k?'on':''}" data-a=lsort data-i=${k}>${l}</button>`).join('')}</div>
${L.length?'':'<p class=mu>Your list is empty. Add items, or add a recipe to your meal plan.</p>'}
${Object.keys(g).sort().map(k=>`${U.ls==='shop'?`<h3>${esc(k)}</h3>`:''}<div class=card>${g[k].map(x=>{const b=best(x.name,x.b);return `<div class="it ${x.done?'dn':''}"><input type=checkbox data-a=tick data-i=${x.id} ${x.done?'checked':''} aria-label="Got it"><div class=g><div>${esc(x.name)}</div><small>${b?`Cheapest: ${esc(b.s)} ${gbp(b.p)}${lab(x.b)}`:'No price yet'}</small></div>${stp('lq',x.id,fmt(x.qty,x.b||''))}<button class=x data-a=ldel data-i=${x.id} aria-label="Remove">✕</button></div>`}).join('')}</div>`).join('')}
${nd?`<button class=pri data-a=fin style="width:100%;margin-bottom:12px">Finish shop: add ${nd} bought to inventory</button>`:''}
${tot.length?`<h3>Whole shop by store</h3><div class=card>${tot.map(o=>`<div class="tr ${o.s===bs?'best':''}"><span>${esc(o.s)}${o.s===bs?' (cheapest)':''}${o.m?` <small>${o.m} unpriced</small>`:''}</span><b>${gbp(o.t)}</b></div>`).join('')}</div>`:''}`}

function vRec(){
if(U.view==='form')return vForm();
if(U.view==='detail'&&recOf(U.rid))return vDet();
const all=[...new Set(D.rec.flatMap(tl))],rs=D.rec.filter(r=>!U.f||tl(r).includes(U.f));
return `<h1>Recipes</h1><button class=pri data-a=rnew style="width:100%;margin-bottom:12px">New recipe</button>
${all.length?`<div class=chips><button class="chip ${U.f?'':'on'}" data-a=rf data-i="">All</button>${all.map(t=>`<button class="chip ${U.f===t?'on':''}" data-a=rf data-i="${esc(t)}">${esc(t)}</button>`).join('')}</div>`:''}
${D.rec.length?'':'<p class=mu>No recipes yet. Add your first one with a photo, ingredients and method.</p>'}
<div class=grid>${rs.map(r=>`<button class=rc data-a=ropen data-i=${r.id}><div class=im ${r.photo?`style="background-image:url(${r.photo})"`:''}>${r.photo?'':'🍽️'}</div><div class=t><b>${esc(r.name)}</b><br><small>${esc(tl(r).join(', '))}</small></div></button>`).join('')}</div>`}

function vForm(){
const r=recOf(U.rid)||{};U.ph=r.photo||'';
return `<h1>${r.id?'Edit recipe':'New recipe'}</h1><div class=card>
<div class="im hero" id=pv ${U.ph?`style="background-image:url(${U.ph})"`:''}>${U.ph?'':'📷'}</div>
<input id=ph type=file accept="image/*">
<input id=rn placeholder="Recipe name" value="${esc(r.name||'')}">
<div class=row><input id=rc list=cl placeholder="Cuisine" value="${esc(r.cuisine||'')}"><input id=rs type=number min=1 value="${r.serves||4}" aria-label="Serves"></div>
<datalist id=cl>${['Italian','Mexican','Indian','Chinese','British','Thai'].map(c=>`<option>${c}</option>`).join('')}</datalist>
<input id=rt placeholder="Tags, e.g. quick, fancy" value="${esc(r.tags||'')}">
<textarea id=ri placeholder="Ingredients, one per line, e.g.&#10;500 g mince&#10;2 kidney beans&#10;1 l stock">${esc((r.ing||[]).map(g=>fmt(g.qty,g.b||'')+' '+g.name).join('\n'))}</textarea>
<textarea id=rp placeholder="Method">${esc(r.steps||'')}</textarea>
<div class=row><button class=sec data-a=rcancel>Cancel</button><button class=pri data-a=rsave>Save recipe</button></div></div>`}

function vDet(){
const r=recOf(U.rid),sv=U.sv||r.serves,k=sc(r);let cost=0,miss=0;
const rows=r.ing.map((g,i)=>{const b0=g.b||'',q=N(g.qty*k),h=have(g.name,b0),need=N(Math.max(0,q-h)),b=best(g.name,b0);b?cost+=ext(b.p,q,b0):miss++;
return `<div class=it><div class=g><div>${fmt(q,b0)} ${esc(g.name)}</div><small class="${need?'bad':'ok'}">${need?`Need ${fmt(need,b0)} more (have ${fmt(h,b0)})`:`Have enough (${fmt(h,b0)})`}</small></div>${need?`<button class=chip data-a=ring data-i=${i}>+ List</button>`:''}</div>`}).join('');
return `<button class=sec data-a=rback style="margin-bottom:12px">Back</button>
<div class="im hero" ${r.photo?`style="background-image:url(${r.photo})"`:''}>${r.photo?'':'🍽️'}</div>
<h1 style="margin-top:0">${esc(r.name)}</h1><p class=mu>${esc(tl(r).join(', '))}</p>
<div class=card><div class=tr><span>Servings</span>${stp('sv','x',sv)}</div>
<small>${cost?`About ${gbp(cost)} in total, ${gbp(cost/sv)} per serving${miss?` (${miss} unpriced)`:''}`:'Add prices in Shops to see the cost per meal'}</small></div>
<h3>Ingredients</h3><div class=card>${rows||'<small>No ingredients</small>'}</div>
<h3>Method</h3><div class=card style="white-space:pre-wrap">${esc(r.steps||'No method added.')}</div>
<button class=pri data-a=padd style="width:100%;margin-bottom:8px">Add to meal plan</button>
<div class=row><button class=sec data-a=redit>Edit</button><button class="sec bad" data-a=rdel>Delete</button></div>`}

function vPlan(){
return `<h1>Meal plan</h1>${D.plan.length?`<div class=card>${D.plan.map(p=>{const r=recOf(p.rid);if(!r)return'';return `<div class="it ${p.done?'dn':''}"><div class=g><div>${esc(r.name)}</div><small>Serves ${p.sv}${p.done?' · made ✓':''}</small></div>${p.done?'':`<button class=pri data-a=made data-i=${p.id}>Made it</button>`}<button class=x data-a=pdel data-i=${p.id} aria-label="Remove">✕</button></div>`}).join('')}</div>`:'<p class=mu>Open a recipe and tap “Add to meal plan”. Anything you’re missing lands on your shopping list automatically.</p>'}`}

const PROMPT=`This is a photo of a UK supermarket receipt. Reply with only JSON in this shape: {"store":"shop name or empty","items":[{"name":"simple generic ingredient name as used in recipes, e.g. chicken breast, tomatoes, kidney beans","amount":total quantity bought on this line as a number,"unit":"each" or "g" or "kg" or "ml" or "l","total":price paid for the line in pounds as a number}]}. Use the weight or volume for fresh meat, fish and veg sold by weight (e.g. 650g, 1.2kg loose). For tins, jars, bottles, boxes and packs that people count, use unit "each" with amount as the number of units. Skip bags, discounts, subtotals, payment and loyalty lines. Never invent items.`;
function rvEach(x){if(x.u==='each')return{p:x.tot/x.amt,b:''};if(x.cnt)return{p:x.tot/x.cnt,b:''};const o=toB(x.amt,x.u);return{p:x.tot/(o.q/1000),b:o.b}}
const rvTxt=x=>{const o=rvEach(x);return isFinite(o.p)?`${gbp(o.p)} ${plab(o.b)}`:'Enter an amount'};
const shrink=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.85)};im.onerror=no;im.src=URL.createObjectURL(f)});
const canScan=()=>IMG||!!D.key;
async function ask(blob){
if(SM&&IMG)return SM.json(PROMPT,{images:[blob],modelTier:'default'});
const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':D.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:2000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:PROMPT}]}]})});
if(!res.ok)throw{code:res.status===401?'badkey':'api'};
const t=(await res.json()).content.map(c=>c.text||'').join('');
return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1))}
async function scan(file){
U.rs='busy';U.msg='';R();
try{
const out=await ask(await shrink(file));
const items=(out.items||[]).map(i=>({n:String(i.name||'').trim(),amt:+i.amount||1,u:UN.includes(i.unit)?i.unit:'each',tot:N(+i.total||0),cnt:0,on:true})).filter(x=>x.n);
if(!items.length)throw{code:'none'};
const s=String(out.store||'').toLowerCase(),sh=SH.find(x=>s.includes(x.toLowerCase().replace(/’s$|s$/,'').slice(0,5)))||U.shop;
U.rv={shop:sh,items};
}catch(e){
const c=e&&e.code;
if(['not_granted','sampling_disabled','images_unavailable','capability_disabled'].includes(c))IMG=false;
U.msg=c==='badkey'?'The API key was rejected. Check it in Settings.':c==='image_rejected'?'That photo couldn’t be used. Try a clearer one.':c==='rate_limited'?'Too many requests. Try again in a moment.':c==='none'?'No items found. Try a brighter, flatter photo.':'Couldn’t read that receipt. Check your connection and try a brighter, flatter photo.';
}
U.rs='';R()}
function vScan(){
if(U.rs==='busy')return `<div class=card><b>Reading receipt…</b><br><small>This can take up to a minute.</small></div>`;
if(U.rv)return vReview();
return `<div class=card>${canScan()?`<label class=pri style="display:block;text-align:center;cursor:pointer">📷 Scan a receipt<input id=rcp type=file accept="image/*" hidden></label>`:`<button class=sec data-t=set style="width:100%">Set up receipt scanning</button>`}${U.msg?`<small class=bad>${esc(U.msg)}</small>`:`<small>${canScan()?'Take or choose a photo. Prices go to the matching shop.':'Add an API key in Settings, or enter prices by hand.'}</small>`}</div>`}
function vReview(){const r=U.rv;
return `<div class=card><b>Check the receipt</b><br><small>Fix anything that looks wrong and untick items to skip them.</small>
<select data-a=rvshop style="margin-top:8px" aria-label="Shop">${SH.map(s=>`<option ${s===r.shop?'selected':''}>${esc(s)}</option>`).join('')}</select>
${r.items.map((x,i)=>`<div class=it style="align-items:flex-start"><input type=checkbox data-a=rvon data-i=${i} ${x.on?'checked':''} aria-label="Include"><div class=g><input type=text data-a=rvn data-i=${i} value="${esc(x.n)}" style="margin-bottom:6px"><div class=row><input type=number min=0 step=any data-a=rva data-i=${i} value="${x.amt}" style="margin:0" aria-label="Amount"><select data-a=rvu data-i=${i} style="margin:0" aria-label="Unit">${UN.map(u=>`<option ${u===x.u?'selected':''}>${u}</option>`).join('')}</select><input type=number min=0 step=0.01 data-a=rvt data-i=${i} value="${x.tot}" style="margin:0" aria-label="Total paid in pounds"></div>${x.u!=='each'?`<input type=number min=1 step=any data-a=rvc data-i=${i} value="${x.cnt||''}" style="margin:6px 0 0" placeholder="Optional: how many items in the ${x.amt} ${x.u}?">`:''}<small id=rvx${i}>${rvTxt(x)}</small></div></div>`).join('')}
${U.msg?`<small class=bad>${esc(U.msg)}</small>`:''}
<div class=row style="margin-top:8px"><button class=sec data-a=rvcancel>Discard</button><button class=pri data-a=rvsave>Save prices</button></div></div>`}

function vShops(){
const s=U.shop,m=D.px[s]||{},ks=Object.keys(m).sort((a,b)=>m[a].n.localeCompare(m[b].n));
return `<h1>Shops</h1>${vScan()}<div class=chips>${SH.map(x=>`<button class="chip ${x===s?'on':''}" data-a=shop data-i="${x}">${x}</button>`).join('')}</div>
<div class=card><input id=sn placeholder="Item, as named in recipes"><div class=row><input id=sp type=number min=0 step=0.01 placeholder="£" aria-label="Price"><select id=spu aria-label="Price per"><option value="">each</option><option value=g>per kg</option><option value=ml>per litre</option></select></div><button class=pri data-a=sadd style="width:100%;margin-top:8px">Save price at ${esc(s)}</button></div>
${ks.length?`<div class=card>${ks.map(k=>`<div class=it><div class=g><div>${esc(m[k].n)}</div><small>${plab(m[k].b)}</small></div><input type=number step=0.01 min=0 value="${m[k].p}" data-a=pxe data-i="${k}" style="width:90px;margin:0" aria-label="Price"><button class=x data-a=sdel data-i="${k}" aria-label="Delete">✕</button></div>`).join('')}</div>`:`<p class=mu>No prices for ${esc(s)} yet.</p>`}`}

function vSet(){
return `<h1>Settings</h1><div class=card><b>Colour</b><div class=chips style="padding:12px 0 8px">${Object.keys(AC).map(k=>`<button class="sw ${D.ac===k?'on':''}" data-a=ac data-i=${k} style="background:${AC[k][0]}" aria-label="${k}"></button>`).join('')}</div>
<div class=chips style="padding-bottom:0">${['auto','light','dark'].map(m=>`<button class="chip ${D.mode===m?'on':''}" data-a=mode data-i=${m}>${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div>
${SM?'':`<div class=card><b>Receipt scanning</b><br><small>Uses your own Anthropic API key, kept only on this phone. Each scan uses a little of your API credit. Without a key you can still add prices by hand.</small><input id=ak type=password placeholder="sk-ant-…" value="${esc(D.key)}" style="margin-top:8px" autocomplete="off"><button class=pri data-a=key style="width:100%">Save key</button></div>`}
<div class=card><b>Backup</b><br><small>Your data lives on this phone. Save a copy now and then.</small><div class=row style="margin-top:8px"><button class=sec data-a=exp>Save backup</button><label class=sec style="text-align:center;cursor:pointer">Restore<input id=imp type=file accept=".json,application/json" hidden></label></div></div>`}

const A={
isort:i=>U.sort=i,
iadd(){const n=v('in');if(!n)return;const o=toB(+v('iqt')||0,v('iu'));addInv(n,o.q,o.b,v('it'),v('il'))},
'iq-':i=>{const x=D.inv.find(x=>x.id===i);x.qty=Math.max(0,N(x.qty-stepOf(x.b)))},
'iq+':i=>{const x=D.inv.find(x=>x.id===i);x.qty=N(x.qty+stepOf(x.b))},
idel:i=>D.inv=D.inv.filter(x=>x.id!==i),
lsort:i=>U.ls=i,
ladd(){const n=v('ln');if(!n)return;const o=toB(+v('lq')||1,v('lu'));addList(n,o.q,o.b)},
sug:i=>{const x=D.inv.find(x=>x.id===i);addList(x.name,x.b?500:1,x.b||'')},
tick:i=>{const x=D.list.find(x=>x.id===i);x.done=!x.done},
'lq-':i=>{const x=D.list.find(x=>x.id===i);x.qty=Math.max(stepOf(x.b),N(x.qty-stepOf(x.b)))},
'lq+':i=>{const x=D.list.find(x=>x.id===i);x.qty=N(x.qty+stepOf(x.b))},
ldel:i=>D.list=D.list.filter(x=>x.id!==i),
fin(){D.list.filter(x=>x.done).forEach(x=>addInv(x.name,x.qty,x.b||''));D.list=D.list.filter(x=>!x.done)},
rf:i=>U.f=U.f===i?'':i,
rnew(){U.rid=null;U.view='form'},
ropen(i){U.rid=i;U.view='detail';U.sv=null},
rback(){U.view=null},
redit(){U.view='form'},
rcancel(){U.view=U.rid?'detail':null},
rdel(){D.rec=D.rec.filter(x=>x.id!==U.rid);D.plan=D.plan.filter(p=>p.rid!==U.rid);U.view=null},
rsave(){const n=v('rn');if(!n)return;
const ing=$('#ri').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d+(?:\.\d+)?)\s*(kg|g|ml|l)?\b\s*(.*)$/i);if(!m||!m[3])return{qty:1,b:'',name:l};const o=toB(+m[1],(m[2]||'each').toLowerCase());return{qty:o.q,b:o.b,name:m[3]}});
const o={name:n,cuisine:v('rc'),tags:v('rt'),serves:+v('rs')||4,ing,steps:$('#rp').value.trim(),photo:U.ph},r=recOf(U.rid);
if(r)Object.assign(r,o);else{o.id=id();D.rec.push(o);U.rid=o.id}U.view='detail';U.sv=null},
'sv-'(){const r=recOf(U.rid);U.sv=Math.max(1,(U.sv||r.serves)-1)},
'sv+'(){const r=recOf(U.rid);U.sv=(U.sv||r.serves)+1},
ring(i){const r=recOf(U.rid),g=r.ing[i],b=g.b||'';addList(g.name,Math.ceil(g.qty*sc(r)-1e-9)-have(g.name,b),b,1)},
padd(){const r=recOf(U.rid);D.plan.push({id:id(),rid:r.id,sv:U.sv||r.serves,done:false});syncPlan();U.tab='plan'},
made(i){const p=D.plan.find(x=>x.id===i),r=recOf(p.rid);r.ing.forEach(g=>{const e=find(D.inv,g.name,g.b||'');if(e)e.qty=Math.max(0,N(e.qty-g.qty*p.sv/r.serves))});p.done=true},
pdel:i=>D.plan=D.plan.filter(x=>x.id!==i),
shop:i=>U.shop=i,
sadd(){const n=v('sn'),p=parseFloat(v('sp')),b=v('spu');if(!n||isNaN(p))return;(D.px[U.shop]=D.px[U.shop]||{})[pk(n,b)]={n,b,p}},
sdel:i=>delete D.px[U.shop][i],
rvon(i){const x=U.rv.items[i];x.on=!x.on},
rvcancel(){U.rv=null;U.msg=''},
rvsave(){const r=U.rv,it=r.items.filter(x=>x.on&&x.n.trim());
if(it.some(x=>!isFinite(rvEach(x).p))){U.msg='Check the amounts, or untick items you don’t need.';return}
const m=D.px[r.shop]=D.px[r.shop]||{};it.forEach(x=>{const o=rvEach(x);m[pk(x.n,o.b)]={n:x.n.trim(),b:o.b,p:N(o.p)}});U.shop=r.shop;U.rv=null;U.msg=''},
ac(i){D.ac=i;theme()},
mode(i){D.mode=i;theme()},
key(){D.key=v('ak')},
exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='shopingg-backup.json';a.click()}
};
const V={inv:vInv,list:vList,rec:vRec,plan:vPlan,shops:vShops,set:vSet};
function R(){save();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===U.tab));$('#v').innerHTML=V[U.tab]()}
document.addEventListener('click',e=>{
const t=e.target.closest('[data-t]');if(t){U.tab=t.dataset.t;U.view=null;U.msg='';scrollTo(0,0);R();return}
const b=e.target.closest('[data-a]');if(!b||b.dataset.a==='pxe')return;
const f=A[b.dataset.a];if(f){f(b.dataset.i);R()}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a,i=t.dataset.i;
if(t.id==='rcp'&&t.files[0]){scan(t.files[0]);return}
if(t.id==='imp'&&t.files[0]){t.files[0].text().then(s=>{try{D=Object.assign(D0(),JSON.parse(s),{key:D.key});theme();R()}catch(x){}});return}
if(a==='pxe'){const p=parseFloat(t.value);if(!isNaN(p)){D.px[U.shop][i].p=p;save()}return}
if(U.rv&&a&&a.startsWith('rv')){const x=U.rv.items[i];
if(a==='rvshop')U.rv.shop=t.value;
if(!x)return;
if(a==='rvn')x.n=t.value;
if(a==='rvu'){x.u=t.value;R();return}
if(a==='rva')x.amt=parseFloat(t.value)||0;
if(a==='rvt')x.tot=parseFloat(t.value)||0;
if(a==='rvc')x.cnt=parseFloat(t.value)||0;
const e2=$('#rvx'+i);if(e2)e2.textContent=rvTxt(x);return}
if(t.id==='ph'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,480/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);U.ph=c.toDataURL('image/jpeg',.7);const pv=$('#pv');pv.style.backgroundImage=`url(${U.ph})`;pv.textContent=''};im.src=fr.result};fr.readAsDataURL(t.files[0])}});
theme();R();
(async()=>{try{if(window.claude){SM=await claude.use('sample');if(SM){const l=await SM.limits();IMG=!!(l&&l.images)}}}catch(e){}if(!U.rv&&!U.rs&&(U.tab==='shops'||U.tab==='set'))R()})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
